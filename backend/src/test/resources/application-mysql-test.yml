# =====================================================================
# 测试档（profile: mysql-test）· task-01C 交付物 3
# 目的：种子断言套件对真 MySQL 复跑——指向 task-01C 常驻容器 cinema-mysql
#   （host 3306，root/cinema2026，库 cinema，数据卷持久化）。
#
# 复跑前置：容器运行中（docker start cinema-mysql）
# 复跑命令：
#   mvn test -Dtest=SeedDataAssertMySQLTest -Dcinema.mysql.tests=true
#   （或整套复跑：mvn test -Dcinema.mysql.tests=true，H2 内存档 + MySQL 档同跑）
#
# 与 profile mysql 的关系：独立测试 profile，不激活正式档；仅覆盖数据源与
# SQL init，其余（ddl-auto=none、BookingConfig 等）继承 application.yml 默认档。
# 安全性：schema.sql 全表 IF NOT EXISTS 幂等 + DataSeeder 幂等（user 表已有数据
# 整体跳过）+ 测试 @Transactional 回滚——对持久库重复复跑安全、不污染种子数据。
# =====================================================================
spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/cinema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "cinema2026"
  sql:
    init:
      # 每次重放 schema.sql（IF NOT EXISTS 幂等），确保容器库未初始化时也能自动建表
      mode: always
