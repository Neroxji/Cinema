# =====================================================================
# 电影票在线购票系统 · 容器化部署（task-01C 交付物 5 / spec §6 物理视图）
# 2 容器：app（Spring Boot, 8080）→ mysql（MySQL 8, 3306, 数据卷持久化）
#
# 启动（若常驻容器 cinema-mysql 在运行，先 docker stop cinema-mysql 让出 3306）：
#   docker compose up -d           # 首次构建用: docker compose up -d --build
#   docker compose ps              # 两容器 healthy / Up
#   docker compose down            # 停止并移除容器（数据卷保留）
#
# 数据卷策略：显式命名 cinema-mysql-data（与独立常驻容器共用同一卷），
#   compose down 不删卷；重置数据 = down 后 docker volume rm cinema-mysql-data。
# =====================================================================
name: cinema

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    # 服务器级 utf8mb4 + utf8mb4_unicode_ci（docker 运行参数实现，与独立容器同参）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "cinema2026"
      MYSQL_DATABASE: "cinema"
      TZ: "Asia/Shanghai"
    ports:
      - "3306:3306"
    volumes:
      - cinema-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcinema2026"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      SPRING_PROFILES_ACTIVE: "mysql"
      # 容器间经服务名互访（不能用 localhost）；参数与 application-mysql.yml 契约一致
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/cinema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "cinema2026"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 检测 Tomcat 8080 端口可建立 TCP 连接（temurin JRE 镜像无 curl/wget，用 bash /dev/tcp）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  # 显式 name：与独立常驻容器 cinema-mysql 用同一命名卷（compose 缺省会在卷名前加项目前缀）
  cinema-mysql-data:
    name: cinema-mysql-data
